name: Validate research workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test publication safeguards
        run: python3 -B tests/test_release.py
      - name: Check publication boundary
        run: python3 scripts/check_release.py --tracked
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ape
            any::phytools
            any::missForest
            any::caper
            any::GGally
            any::ggplot2
      - name: Test analysis behaviour
        run: Rscript tests/test_pipeline.R
      - name: Execute synthetic workflow
        run: Rscript scripts/run_workflow.R
      - name: Render simulated methods illustrations
        run: Rscript scripts/export_methods.R
      - name: Confirm tracked publication boundary
        run: python3 scripts/check_release.py --tracked
